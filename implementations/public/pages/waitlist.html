<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waitlist - Badminton Court Management</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <h2>Badminton Center</h2>
      <div class="nav-links">
        <a href="waitlist.html">Waitlist</a>
        <a href="login.html">Login</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="card" style="max-width: 600px; margin: 2rem auto;">
      <h2 class="text-center mb-4">Court Waitlist</h2>
      <div id="waitlist-error" class="mb-4" style="color: var(--error); display: none;"></div>
      <div id="waitlist-success" class="mb-4" style="color: var(--success); display: none;"></div>

      <!-- Join Waitlist Form -->
      <h3>Join Waitlist</h3>
      <form id="joinWaitlistForm">
        <div class="form-group">
          <label for="court_id">Court ID</label>
          <input type="text" id="court_id" name="court_id" placeholder="Enter court UUID" required>
        </div>
        <div class="form-group">
          <label for="requested_date">Requested Date</label>
          <input type="date" id="requested_date" name="requested_date" required>
        </div>
        <div class="form-group">
          <label for="preferred_time_slot">Preferred Time Slot</label>
          <input type="text" id="preferred_time_slot" name="preferred_time_slot" placeholder="e.g. 10:00-12:00">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Join Waitlist</button>
      </form>

      <hr style="margin: 2rem 0;">

      <!-- My Waitlist Entries -->
      <h3>My Waitlist Entries</h3>
      <button id="refreshWaitlist" class="btn btn-primary mb-4">Refresh</button>
      <div id="waitlistEntries">
        <p>Click "Refresh" to load your waitlist entries.</p>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = '/api/waitlist';

    function getToken() {
      return localStorage.getItem('token');
    }

    function showError(msg) {
      const el = document.getElementById('waitlist-error');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function showSuccess(msg) {
      const el = document.getElementById('waitlist-success');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    // Join waitlist
    document.getElementById('joinWaitlistForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = getToken();
      if (!token) { showError('Please login first.'); return; }

      const body = {
        court_id: document.getElementById('court_id').value,
        requested_date: document.getElementById('requested_date').value,
        preferred_time_slot: document.getElementById('preferred_time_slot').value
      };

      try {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to join waitlist');
        showSuccess('Added to waitlist successfully!');
        document.getElementById('joinWaitlistForm').reset();
        loadWaitlist();
      } catch (err) {
        showError(err.message);
      }
    });

    // Load my waitlist entries
    async function loadWaitlist() {
      const token = getToken();
      if (!token) { showError('Please login first.'); return; }

      try {
        const res = await fetch(`${API_BASE}/my`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const entries = await res.json();
        const container = document.getElementById('waitlistEntries');

        if (!entries.length) {
          container.innerHTML = '<p>No waitlist entries found.</p>';
          return;
        }

        container.innerHTML = entries.map(entry => `
          <div class="card mb-4" style="padding: 1rem; border: 1px solid #eee; border-radius: 8px;">
            <p><strong>Court:</strong> ${entry.court_name || entry.court_id}</p>
            <p><strong>Date:</strong> ${entry.requested_date}</p>
            <p><strong>Time Slot:</strong> ${entry.preferred_time_slot || 'Any'}</p>
            <p><strong>Status:</strong> ${entry.status}</p>
            <button class="btn btn-primary" style="background: var(--error);" onclick="removeEntry('${entry.id}')">Remove</button>
          </div>
        `).join('');
      } catch (err) {
        showError(err.message);
      }
    }

    // Remove from waitlist
    async function removeEntry(id) {
      const token = getToken();
      try {
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to remove');
        showSuccess('Removed from waitlist.');
        loadWaitlist();
      } catch (err) {
        showError(err.message);
      }
    }

    document.getElementById('refreshWaitlist').addEventListener('click', loadWaitlist);
  </script>
</body>
</html>
